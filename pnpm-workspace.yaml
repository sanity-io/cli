linkWorkspacePackages: true
overrides:
  '@sanity/cli': 'workspace:*'
  '@types/node': 'catalog:'

packages:
  - 'packages/@repo/*'
  - 'packages/@sanity/cli'
  - 'packages/@sanity/cli-build'
  - 'packages/@sanity/cli-core'
  - 'packages/@sanity/cli-e2e'
  - 'packages/@sanity/cli-test'
  - 'packages/@sanity/eslint-config-cli'
  - 'packages/@sanity/workbench-cli'
  - 'packages/create-sanity'
  - 'fixtures/*'
  - 'tmp/*'

catalog:
  # Linting
  eslint: ^10.7.0
  '@eslint/compat': ^2.1.0
  publint: ^0.3.21

  # GROQ
  groq-js: ^2.0.0

  # Sanity
  sanity: ^6.12.0
  '@sanity/vision': ^6.12.0
  '@sanity/types': ^6.12.0
  '@sanity/schema': ^6.12.0
  '@sanity/client': ^8.5.0
  '@sanity/codegen': ^8.1.0
  '@sanity/telemetry': ^1.1.0

  # Build & Development Tools
  babel-plugin-react-compiler: ^1.0.0
  oxc-transform-react: ^0.147.0
  typescript: ^6.0.3
  vite: ^8.2.2
  '@vitejs/plugin-react': ^6.1.1
  tsx: ^4.23.12

  # Testing
  vitest: ^4.1.11
  '@vitest/coverage-istanbul': ^4.1.11
  nock: ^14.0.15
  node-pty: ^1.1.0
  strip-ansi: ^7.1.0

  # CLI Framework
  '@oclif/core': ^4.11.14
  '@oclif/plugin-help': ^6.2.53
  '@oclif/plugin-not-found': ^3.2.88

  # Utilities
  get-it: ^9.5.2
  obug: ^2.1.4
  jsdom: ^29.1.1
  zod: ^4.5.4
  'get-tsconfig': ^4.14.3
  'import-meta-resolve': ^4.2.0
  execa: ^10.0.1
  empathic: ^2.0.1
  ora: ^9.0.0
  rxjs: ^7.8.2
  tinyglobby: ^0.2.17
  lodash-es: ^4.18.1
  '@types/lodash-es': ^4.17.12
  yaml: ^2.9.0
  form-data: ^4.0.5
  tar: ^7.5.18

  # Build Tools
  '@swc/core': ^1.15.43
  '@swc/cli': ^0.8.1
  rimraf: ^6.0.1
  '@sanity/pkg-utils': ^12.3.4
  oxfmt: ^0.66.0

  # Type Definitions
  '@types/node': ^22.20.0
  '@types/jsdom': ^28.0.3

minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@portabletext/*'
  - '@sanity/*'
  - '@types/*'
  - 'eventsource'
  - 'eventsource-parser'
  - 'get-it'
  - 'groq-js'
  - 'groq'
  - 'lodash-es'
  - 'react-rx'
  - 'sanity'
  - 'sanity-plugin-media'
  - 'use-effect-event'
  - 'oxfmt'
  - '@oxfmt/*'
  - 'vite'
  - '@vitejs/*'
  # Vite's bundler; same trust domain and release cadence as vite itself.
  # Needed so vite's `rolldown: ~x.y.z` range can pick up fresh patch fixes.
  # `@rolldown/*` covers the per-platform native binding packages released in
  # lockstep with `rolldown`.
  - 'rolldown'
  - '@rolldown/*'
  # Oxc's Rust port of React Compiler; same trust domain as oxfmt/rolldown
  # above. `@oxc-transform-react/*` covers the per-platform native binding
  # packages released in lockstep with `oxc-transform-react`.
  - 'oxc-transform-react'
  - '@oxc-transform-react/*'
  - 'vitest'
  - 'postcss'
  - '@vitest/*'

  # pnpm v11 upgrade
  - '@codemirror/search@6.7.2'
  - '@codemirror/state@6.7.2'
  - '@codemirror/view@6.43.10'
  - '@sentry/browser-utils@10.73.0'
  - '@sentry/browser@10.73.0'
  - '@sentry/core@10.73.0'
  - '@sentry/feedback@10.73.0'
  - '@sentry/react@10.73.0'
  - '@sentry/replay-canvas@10.73.0'
  - '@sentry/replay@10.73.0'
  - i18next@26.4.1
  - react-i18next@17.0.13
allowBuilds:
  '@swc/core': true
  esbuild: true
  node-pty: true
  sharp: false
  unrs-resolver: false
