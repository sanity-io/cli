name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # for version bump commits and tags
  pull-requests: write # for creating Version Packages PR
  id-token: write # to enable use of OIDC for npm provenance

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      publishedPackages: ${{ steps.changesets.outputs.publishedPackages }}

    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - name: Generate GitHub App Token
        id: generate_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.ECOSPARK_APP_ID }}
          private-key: ${{ secrets.ECOSPARK_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.generate_token.outputs.token }}
          persist-credentials: false

      - name: Get app token user id
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.generate_token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}

      - name: Setup git user
        run: |
          git config --global user.name '${{ steps.generate_token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.generate_token.outputs.app-slug }}[bot]@users.noreply.github.com'

      - name: Setup Environment
        uses: ./.github/actions/setup
        with:
          node-version: 24

        # Update npm to use trusted publishing (OIDC)
      - name: Update npm
        run: npm install -g npm@latest

      - name: Build packages
        run: pnpm run build:cli

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm version-packages
          publish: pnpm publish-packages
          title: 'chore: version packages'
          commit: 'chore: version packages'
          createGithubReleases: true
          setupGitUser: false
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
          NPM_CONFIG_PROVENANCE: true

      - name: Summary
        if: ${{ steps.changesets.outputs.published == 'true' }}
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          echo "## Published Packages 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Published packages:" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          echo "$PUBLISHED_PACKAGES" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # npm scans new versions before making them installable, so a successful publish
      # doesn't mean consumers can install yet. Our packages reference each other with
      # `^` ranges, so a partially-available release is an unresolvable tree. A version
      # can also be held for review or blocked outright - `timeout-minutes` turns that
      # into a failed job rather than a wait with no end.
      - name: Wait for published versions to become installable
        if: ${{ steps.changesets.outputs.published == 'true' }}
        timeout-minutes: 20
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          for spec in $(jq -r '.[] | "\(.name)@\(.version)"' <<< "$PUBLISHED_PACKAGES"); do
            echo "Waiting for $spec"
            until npm view "$spec" version > /dev/null 2>&1; do
              echo "  not installable yet, retrying in 15s"
              sleep 15
            done
            echo "  installable"
          done

  post-release:
    runs-on: ubuntu-latest
    needs: release
    if: ${{ needs.release.outputs.published == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Mark SDK issues as done
        uses: sanity-io/mark-issues-done-action@88e6a3e6bc5a9c86d45873c4dba3302a4cafcb65 # main
        with:
          linear_api_key: ${{ secrets.LINEAR_API_KEY }}
          repository_name: ${{ github.event.repository.name }}
          initial_state_id: 'c56956cd-c281-4ca5-889f-6189ce231a6d'
          done_state_id: '5a35b7bf-6d37-4cc2-854a-2f18d160e2e5'

      - name: Mark AI Growth issues as done
        uses: sanity-io/mark-issues-done-action@88e6a3e6bc5a9c86d45873c4dba3302a4cafcb65 # main
        with:
          linear_api_key: ${{ secrets.LINEAR_API_KEY }}
          repository_name: ${{ github.event.repository.name }}
          initial_state_id: 'f39e3f44-58e1-4c01-8cb7-8497b7f27e52'
          done_state_id: 'c7fa599f-2b6e-4361-a229-d8db2a901f8a'
